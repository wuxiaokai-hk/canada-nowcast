# Canadian GDP nowcast, evaluated in real time.
source: simulated            # simulated | lcdma (real vintages, after python tools/get_lcdma.py)
lcdma_folder: data/lcdma
target_column: REAL_GDP      # LCDMA quarterly real GDP (chained dollars, level)
monthly_columns:             # LCDMA monthly indicators (levels; made stationary in the code)
  [GDP_new, IP_new, RT_new, WT_new, CON_new, EMP_CAN, UNEMP_CAN, TOT_HRS_CAN, hstart_CAN_new,
   build_Total_CAN_new, MANU_N_ORD_new, Exp_BP_new, Imp_BP_new, CPI_ALL_CAN, TSX_CLO, GOV_AVG_10pY]
max_monthly: 20
vintage_start: 2012-01-01     # simulated source; LCDMA uses every vintage it finds
dfm: true                    # the mixed-frequency dynamic factor model (slower)
report_dir: report
